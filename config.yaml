# Настройки радара. Здесь только то, что должен заполнить человек.
# СЕКРЕТЫ СЮДА НЕ ПИШЕМ — токен ВК берётся из переменной окружения VK_TOKEN.

# Ящик, который уходит в User-Agent на чужие сайты вместе с каждым запросом.
# Должен реально существовать и читаться: это вежливость и способ не получить
# блокировку — владелец сайта должен иметь возможность написать нам, а не банить.
contact_email: "example@gmail.com"

# Как представляемся. Меняется редко.
bot_name: "RadarBot"
bot_version: "0.1"
bot_url: "https://okk-ai.ru"

# ─────────── Настройки ежедневного сбора (Фаза 2) ───────────
# Здесь то, что можно менять, не заглядывая в код. Значения ниже — те же,
# что зашиты в сборщике по умолчанию; строку можно удалить, ничего не изменится.
collect:

  # Пауза между двумя обращениями к одному сайту. Вежливость и защита от
  # блокировки: два запроса в секунду с одного адреса выглядят как нападение,
  # один раз в две секунды — как посетитель.
  delay_sec: 2

  # Сколько ждём ответа и сколько раз повторяем при сбое сети.
  timeout_sec: 20
  retries: 2

  # Соблюдать правила, которые сайт выставляет роботам в файле robots.txt.
  # Выключать нельзя: это то, что отличает наблюдение от нападения.
  respect_robots: true

  # Санитарная проверка снимка. Если со страницы пришло меньше 200 символов —
  # это поломка сбора, а не опустевшая страница: такой снимок не сохраняется,
  # вчерашний остаётся на месте, а строка уходит в «требует внимания».
  min_visible_chars: 200

  # Вторая половина той же проверки: текст усох сильнее, чем до этой доли от
  # эталонного объёма (замерен в Фазе 0 и записан в sources.yaml). 0.4 значит
  # «осталось меньше 40 процентов» — тоже подозрение, а не изменение.
  shrink_ratio: 0.4

  # Сколько дней держим полные снимки. Старше — удаляем, но самый свежий
  # снимок каждой страницы остаётся всегда, сколько бы ему ни было лет.
  keep_days: 90

  # Сколько последних публикаций берём из каналов соцсетей.
  telegram_posts: 30
  vk_posts: 20

# ─────────── Настройки поиска изменений (Фаза 3) ───────────
detect:

  # Порог: сколько символов видимого текста должно быть затронуто, чтобы
  # изменение считалось изменением, а не мелкой правкой. Значение из плана.
  # Считается по-честному: перестановка блоков и метки шумодава в этот объём
  # не входят, иначе новая статья в блоге выглядела бы как переписанная
  # страница. Поднимать или опускать — по итогам недели обкатки в Фазе 6,
  # а не заранее: сейчас это разумная догадка, а не измеренная величина.
  min_changed_chars: 120

  # Числа на коммерческих страницах проходят мимо порога. Правка цены задевает
  # восемь символов — «49 000 ₽» превращается в «54 000 ₽», — и общий порог
  # похоронил бы главный сигнал системы. Выключать нельзя, кроме как ради
  # опыта: с false радар перестанет замечать смену цен.
  numbers_ignore_threshold: true

  # Сколько строк изменения показывать на экране и в сводке дня. Полная
  # дельта в любом случае лежит в diffs/<домен>/<страница>/<дата>.json.
  sample_lines: 8

# ─────────── Настройки уведомлений (Фаза 4) ───────────
# Договорённость с заказчиком: обычное копится и уходит одной сводкой по
# понедельникам, критичное проверяется каждый день и отправляется сразу.
# Что считается критичным — в rules.yaml, там же и объяснено.
#
# Доступ к боту сюда не пишем. Он живёт в telegram_tokens.json рядом с
# notify.py (закрыт .gitignore) или в переменных окружения TELEGRAM_BOT_TOKEN
# и TELEGRAM_CHAT_ID. Как завести бота — в TELEGRAM-BOT.md.
notify:

  # Сколько дней берёт недельная сводка. Считается назад от вчерашнего дня:
  # сводку шлют утром понедельника, и неделя в ней — прошлая, целиком.
  digest_days: 7

  # Сколько строк-улик показывать в срочном сообщении. Больше — сообщение
  # перестаёт читаться с телефона; полная дельта всегда лежит в diffs/.
  lines_in_alert: 6

  # Сколько изменений на одного конкурента показывать в недельной сводке.
  # Остальные сворачиваются в строку «…и ещё N».
  items_in_digest: 5

  # Сколько строк «появилось» и сколько строк «исчезло» показывать под каждым
  # изменением в сводке. Это самое ценное в ней: по строке «+ Теперь можно
  # выгружать отчёты в Excel» видно новую возможность конкурента, а по строке
  # «изменение на 377 символов» — ничего.
  lines_in_digest_item: 3

  # Сколько мелких появлений и исчезновений показывать в сводке отдельным
  # списком. Мелочь — то, что не дотянуло до порога Фазы 3 и срочным не
  # оказалось. Человека ею не будят, но и терять нельзя: «Теперь с поддержкой
  # WhatsApp» — тридцать символов и целая новая возможность.
  minor_in_digest: 10

  # Дочитывать ли новость по ссылке перед отправкой срочного сообщения. Радар
  # видит ленту новостей, а не сами новости: в ленте «Актуализация тарифов» и
  # одна строка описания, а на что меняются цены — внутри. С follow_links: true
  # радар открывает новость сам и кладёт в сообщение её начало: дату, с которой
  # цены другие, и сами новые цены. Это два лишних запроса к чужому сайту и
  # только ради срочного — обычное ждёт понедельника, его человек откроет сам.
  follow_links: true
  follow_lines: 6
  follow_max: 2

  # Отправлять ли критичное сразу. Выключать стоит ровно один раз — на неделю
  # обкатки Фазы 6, когда сообщения смотрят глазами, а не рассылают. С false
  # критичное не пропадает, а уходит вместе со сводкой.
  send_critical: true

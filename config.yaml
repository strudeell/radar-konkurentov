# Настройки радара. Здесь только то, что должен заполнить человек.
# СЕКРЕТЫ СЮДА НЕ ПИШЕМ — токен ВК берётся из переменной окружения VK_TOKEN.

# Ящик, который уходит в User-Agent на чужие сайты вместе с каждым запросом.
# Должен реально существовать и читаться: это вежливость и способ не получить
# блокировку — владелец сайта должен иметь возможность написать нам, а не банить.
contact_email: "example@gmail.com"

# Как представляемся. Меняется редко.
bot_name: "RadarBot"
bot_version: "0.1"
bot_url: "https://okk-ai.ru"

# ─────────── Настройки ежедневного сбора (Фаза 2) ───────────
# Здесь то, что можно менять, не заглядывая в код. Значения ниже — те же,
# что зашиты в сборщике по умолчанию; строку можно удалить, ничего не изменится.
collect:

  # Пауза между двумя обращениями к одному сайту. Вежливость и защита от
  # блокировки: два запроса в секунду с одного адреса выглядят как нападение,
  # один раз в две секунды — как посетитель.
  delay_sec: 2

  # Сколько ждём ответа и сколько раз повторяем при сбое сети.
  timeout_sec: 20
  retries: 2

  # Соблюдать правила, которые сайт выставляет роботам в файле robots.txt.
  # Выключать нельзя: это то, что отличает наблюдение от нападения.
  respect_robots: true

  # Санитарная проверка снимка. Если со страницы пришло меньше 200 символов —
  # это поломка сбора, а не опустевшая страница: такой снимок не сохраняется,
  # вчерашний остаётся на месте, а строка уходит в «требует внимания».
  min_visible_chars: 200

  # Вторая половина той же проверки: текст усох сильнее, чем до этой доли от
  # эталонного объёма (замерен в Фазе 0 и записан в sources.yaml). 0.4 значит
  # «осталось меньше 40 процентов» — тоже подозрение, а не изменение.
  shrink_ratio: 0.4

  # Сколько дней держим полные снимки. Старше — удаляем, но самый свежий
  # снимок каждой страницы остаётся всегда, сколько бы ему ни было лет.
  keep_days: 90

  # Сколько последних публикаций берём из каналов соцсетей.
  telegram_posts: 30
  vk_posts: 20

# Словарь шумодава: что на странице меняется само по себе, без действий конкурента.
#
# Зачем он нужен. Радар сравнивает вчерашний текст страницы с сегодняшним. Но на
# любом сайте есть куски, которые меняются каждый день сами: часы, счётчик
# просмотров, «опубликовано вчера», год в подвале. Если их не убрать, радар будет
# каждое утро сообщать об «изменении», которого не было, и его перестанут читать.
#
# Как это работает. Каждое правило ниже — это образец текста и то, чем он
# заменяется. Замена ставит на место меняющегося куска постоянную метку: было
# «17 августа 2026» — стало «<дата>». Завтра там будет «18 августа 2026», но
# при сравнении снова окажется «<дата>», и разницы не возникнет.
#
# Где именно ставится метка — важно, и с 19.08.2026 это изменено. Раньше метку
# ставил сборщик, и снимок ложился на диск уже обезличенным. Оказалось, что так
# нельзя: из снимка метка попадает в сообщение человеку. Новость Mango Office
# «С 1 сентября 2026 года MANGO OFFICE обновляет тарификацию» превращалась в
# «С <дата> …», и владелец получал срочное сообщение о смене цен без даты, с
# которой они меняются. Теперь снимок хранит текст как есть, а метки ставятся
# в момент сравнения (diffing.mask). Правила от этого не изменились — изменился
# только шаг, на котором они применяются.
#
# Что важно понимать: правило убирает не смысл, а только сам меняющийся кусок.
# Новая статья в блоге всё равно попадёт в снимок — своим заголовком. Исчезнет
# лишь дата рядом с ним.
#
# Это единственный файл, кроме sources.yaml, который придётся переписать при
# переносе радара на другой рынок. Правила подбираются на живых данных: неделя
# наблюдений в Фазе 6 покажет, чего не хватает.
#
# Синтаксис образца — регулярные выражения Python, без учёта регистра.
# Правила применяются к каждой строке снимка по очереди, сверху вниз.

global:

  - name: дата цифрами (17.08.2026, 17/08/26)
    pattern: '\b\d{1,2}[./]\d{1,2}[./]\d{2,4}\b'
    replace: '<дата>'

  # Найдено первым прогоном по расписанию 20.08.2026: у SalesAI на служебной
  # странице стоит строка «> **Updated**: 2026-08-19». Она меняется каждый день
  # по определению, а правило выше её не ловило — там дата через точки, здесь
  # через дефисы. Двадцать пять символов ежедневного шума в недельной сводке.
  - name: дата в машинном виде (2026-08-19)
    pattern: '\b\d{4}-\d{2}-\d{2}\b'
    replace: '<дата>'

  - name: дата словами с годом (17 августа 2026 года)
    pattern: '\b\d{1,2}\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)\S*\s+\d{4}(\s*(год\S*|г\.|г(?![а-яё])))?'
    replace: '<дата>'

  - name: дата словами без года (17 августа)
    pattern: '\b\d{1,2}\s+(январ|феврал|март|апрел|мая|июн|июл|август|сентябр|октябр|ноябр|декабр)\S*'
    replace: '<дата>'

  - name: дата сокращённо (18 авг, 05 сен)
    pattern: '\b\d{1,2}\s+(янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)\.?(?![а-яё])'
    replace: '<дата>'

  - name: время (14:35, 14:35:02)
    pattern: '\b\d{1,2}:\d{2}(:\d{2})?\b'
    replace: '<время>'

  - name: «сколько времени назад» (3 часа назад, вчера, сегодня)
    pattern: '\b(\d+\s+(секунд|минут|час|дн|день|недел|месяц|год|лет)\S*\s+назад|только что|вчера|сегодня|позавчера)\b'
    replace: '<когда>'

  - name: год в копирайте (© 2026, © 2019–2026)
    pattern: '(©|&copy;|\(c\))\s*\d{4}(\s*[-–—]\s*\d{4})?'
    replace: '© <год>'

  - name: счётчики просмотров, подписчиков, людей онлайн
    pattern: '\b\d[\d\s .,]*\s*(просмотр\S*|подписчик\S*|читател\S*|участник\S*|человек\S*\s+онлайн|онлайн)\b'
    replace: '<счётчик>'

  - name: счётчик коротким видом (1,2K просмотров)
    pattern: '\b\d+[.,]?\d*\s*[KkКк]\s+(просмотр\S*|подписчик\S*)'
    replace: '<счётчик>'

  - name: длинные шестнадцатеричные строки — токены, хеши сборки, номера сессий
    pattern: '\b[0-9a-f]{16,}\b'
    replace: '<идентификатор>'

  - name: номер сборки в адресе файла (?v=1723891200, ?build=4471)
    pattern: '[?&](v|ver|version|build|rev|_|t|ts|cb)=[\w.-]+'
    replace: ''


# Правила для конкретных площадок. Ключ — домен или его хвост.
# Пока пусто: каналы Telegram и ВКонтакте разбирает отдельная программа, которая
# берёт из них только текст публикаций — вырезать там уже нечего.
by_host: {}


# Правила для отдельных видов страниц. Ключ — вид из sources.yaml:
# home, pricing, blog, cases, integrations, extra.
#
# Зачем такое разделение. На странице блога число само по себе, отдельной
# строкой, — это счётчик просмотров: «693» вчера, «801» сегодня. На странице
# тарифов точно такое же число — это цена: «19 000», «399 990». Одно правило на
# все страницы либо пропустит счётчики, либо сотрёт цены, а цена — самый ценный
# сигнал во всей системе. Поэтому счётчики режутся только там, где они водятся:
# в списках публикаций и кейсов.
#
# Проверено на живых данных 19.08.2026: на восьми страницах тарифов нашлось
# 416 строк-чисел, и все до одной оказались ценами. На четырнадцати страницах
# блогов — 305 таких строк, и все до одной оказались счётчиками просмотров.
#
# Цена этого правила: если на странице блога появится осмысленное число
# отдельной строкой, радар его не заметит. Мы посчитали такой размен выгодным.
by_kind:

  blog:
    - name: счётчик просмотров отдельной строкой (693, 1 052, 4.6к.)
      pattern: '^\s*\d[\d\s .,]*\s*([кКkK]\.?)?\s*$'
      replace: ''

  cases:
    - name: счётчик просмотров отдельной строкой
      pattern: '^\s*\d[\d\s .,]*\s*([кКkK]\.?)?\s*$'
      replace: ''


# ─────────── Шумодав уровня изменения (Фаза 3) ───────────
#
# Правила выше работают при съёмке страницы: они меняют текст снимка. Правила
# ниже работают при сравнении двух снимков и текст не трогают — они говорят
# детектору: «появление или исчезновение такой строки изменением не считать».
#
# Зачем нужно и то, и другое. Заменить дату на «<дата>» при съёмке — это убрать
# шум из текста. Но разметка страницы иногда двигается сама: блок переехал, и
# строка «<дата>» ушла из одного места и появилась в другом. Текст при этом не
# изменился ни на букву, а построчное сравнение покажет «удалено 1, добавлено 1».
# Такие строки отсеиваются здесь.
#
# Две проверки встроены в детектор и в этот список не вынесены, потому что от
# рынка не зависят: строка целиком из меток шумодава («<дата>», «<счётчик>»)
# и строка без единой буквы и цифры — обломки вёрстки вроде «·» или «→».
#
# Список заведомо неполон, и это нормально: он подбирается на живых данных.
# Шумодав Фазы 2 настроен на одном дне наблюдений и поймал то, что меняется
# ежедневно. Что меняется раз в неделю — сезонные баннеры, ротация отзывов,
# «осталось 3 места» — покажет неделя обкатки в Фазе 6. Дописывать сюда.
diff:

  ignore_lines:

    - name: обратный отсчёт акции и «осталось N мест»
      pattern: '^\s*(осталось|до конца акции|скидка действует)\b.{0,40}$'

    - name: приглашение подгрузить ещё (меняется вместе с числом записей)
      pattern: '^\s*(показать|загрузить|смотреть)\s+(ещё|еще)\b.{0,20}$'

    # Найдено первым прогоном по расписанию 20.08.2026. На странице интеграций
    # Mango Office в видимый текст то попадает, то не попадает раскрытое меню
    # входа: «Войти», «Личный кабинет», «Пароль», «Забыли пароль?», «Корзина».
    # Двенадцать строк — этого хватает, чтобы перешагнуть порог и занять место
    # в недельной сводке под заголовком «Mango Office · Войти». К тому, что
    # делает конкурент, отношения не имеет: это обвязка сайта, а не его товар.
    - name: меню входа, регистрации и корзины
      pattern: '^\s*(войти|вход|выйти|выход|личный кабинет|интернет-магазин|войти в интернет-магазин|лицевой счет|лицевой счёт|пароль|забыли пароль\?|вы наш новый клиент\?|зарегистрироваться|регистрация|корзина)\s*$'

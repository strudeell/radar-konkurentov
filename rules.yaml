# Правила срочности: что радар присылает сразу, а что копит до понедельника.
#
# Зачем этот файл отдельно от кода. Договорённость с заказчиком простая:
# обычные изменения уходят в недельную сводку, критичные проверяются каждый
# день и, если нашлись, отправляются в тот же час. Значит, вся система держится
# на одном решении — «это критично или нет». Решение принимается по таблице из
# 03-chto-otslezhivat.md, а таблица написана словами живого рынка: «тариф»,
# «гарантия результата», «коробочная версия». Слова рынка меняются, и менять их
# должно быть можно без правки программы — поэтому они лежат здесь.
#
# Что считается критичным (та же таблица, в порядке ценности):
#   1. Изменилась цена.
#   2. Появился или исчез тариф.
#   3. Появился новый продукт или новый канал анализа.
#   4. Сменилось главное обещание на первом экране главной страницы.
#   5. Появился лимит, которого не было.
#   6. Появилась гарантия результата.
# Всё остальное — статьи, посты, кейсы, новые интеграции, правки текстов —
# обычное, копится в недельную сводку.
#
# Первые два пункта программа находит числами и без словаря: этим занимается
# разбор цен Фазы 3, и он работает на всех коммерческих страницах одинаково.
# Пункты 3–6 словами не описываются числами, для них и нужен словарь ниже.
#
# Как читать правило. `pattern` — регулярное выражение Python без учёта
# регистра, оно проверяется на каждой строке, которую детектор счёл добавленной
# или удалённой. `pages` — виды страниц, где правило работает («любая» —
# везде, «канал» — посты в Telegram и ВКонтакте). `when` — искать ли слово
# среди появившегося, исчезнувшего или того и другого. `say` — как это
# объяснить человеку в сообщении.
#
# Словарь заведомо неполон, и это нормально. Он писался по страницам девятнадцати
# конкурентов, снятым в августе 2026 года; чего в них не было — того здесь нет.
# Неделя обкатки Фазы 6 покажет, каких слов не хватает и какие ловят лишнее.
# Вместе с sources.yaml и noise.yaml это третий и последний файл, который
# переписывается при переносе радара на другой рынок.

# ─────────── Первый экран главной страницы ───────────
#
# Главное обещание конкурента — это верх его главной страницы: заголовок,
# подзаголовок и кнопка. Смена этих строк означает, что игрок развернулся, и
# ждать понедельника тут нельзя. Ниже первого экрана идут блоки «как это
# работает», отзывы и подвал — их правки к обещанию отношения не имеют.
#
# Считается не по номеру строки, а по содержательным строкам, и это не
# придирка. Замер по всем семнадцати главным страницам, снятым 18.08.2026:
# заголовок первого экрана стоит на 2-й строке у Phonix, на 17-й у Речки, на
# 24-й у Mango Office и на 50-й у Imot.io — потому что выше него лежит меню
# сайта, а у Imot.io оно ещё и продублировано. Простое «первые пятнадцать
# строк» поймало бы восемь страниц из семнадцати, а на остальных молчало бы.
#
# Поэтому пункты меню и кнопки (строки короче min_chars) пропускаются, и
# берутся первые lines строк, в которых есть текст. У всех семнадцати главных
# первый экран в эти шесть строк укладывается.
#
# Обратная сторона размена: короткую строку внутри первого экрана
# («Новинка!», «Бесплатно») правило не увидит. Это осознанно — иначе в первый
# экран попадает всё меню сайта, и смена языковой кнопки становится срочным
# сообщением. Проверить на неделе обкатки Фазы 6.
first_screen:
  lines: 6
  min_chars: 25
  pages: [home]
  say: изменился первый экран главной — это главное обещание конкурента

# ─────────── Числа на коммерческих страницах ───────────
numbers:
  # Сколько строк «было → стало» показывать в сообщении. Остальные останутся
  # в файле дельты: сообщение должно читаться с телефона, а не пролистываться.
  in_message: 6

  # Порог наводнения. Если на странице разом поменялось больше стольких чисел —
  # это почти всегда не смена цены, а пересборка прайса целиком. У Roistat на
  # странице тарифов 960 чисел (аренда номеров по городам), и переиндексация
  # этого списка выдала бы сотни «изменений цены». Сообщение всё равно уйдёт
  # сразу — такое пропускать нельзя, — но текст будет другой: «массовая правка
  # чисел, смотреть глазами», без попытки перечислить всё.
  flood: 40

# ─────────── Словарь слов, которые делают изменение критичным ───────────
keywords:

  - name: гарантия результата
    pattern: '(гаранти\w*\s+(результат\w*|возврат\w*|рост\w*)|вернём\s+деньги|вернем\s+деньги|возврат\w*\s+денег|money[-\s]?back)'
    pages: [home, pricing, extra, integrations, cases]
    when: [появилось, исчезло]
    say:
      появилось: появилась гарантия результата — сильнейший ответ на «а сработает ли»
      исчезло: исчезла гарантия результата

  - name: бесплатный тариф или пробный период
    pattern: '(бесплатн\w*\s+(тариф\w*|план\w*|верси\w*|доступ\w*|период\w*)|бесплатно\s+навсегда|free\s+(plan|tier|версия)|пробн\w*\s+период\w*|тестов\w*\s+период\w*|\btrial\b|демо-?доступ\w*)'
    pages: [home, pricing]
    when: [появилось, исчезло]
    say:
      появилось: появился бесплатный тариф или пробный период — это смена стратегии, а не правка цены
      исчезло: исчез бесплатный тариф или пробный период

  - name: тариф назвали или убрали
    pattern: '(нов\w*\s+тариф\w*|тарифн\w*\s+план\w*|появил\w*\s+тариф\w*|тариф\s+[«"„]|линейк\w*\s+тариф\w*)'
    pages: [home, pricing]
    when: [появилось, исчезло]
    say:
      появилось: на странице назван новый тариф
      исчезло: со страницы убран тариф

  - name: Enterprise и установка на своих серверах
    pattern: '(on-?\s?premise|on-?prem\b|коробочн\w*|локальн\w*\s+(установк\w*|разверт\w*|инсталляц\w*)|частн\w*\s+облак\w*|в\s+контуре\s+заказчика|на\s+ваш\w*\s+сервер\w*|на\s+сво\w*\s+сервер\w*|\benterprise\b)'
    pages: [home, pricing, integrations, extra]
    when: [появилось, исчезло]
    say:
      появилось: заявлена установка в контуре заказчика или Enterprise — заход в крупных клиентов
      исчезло: со страницы убрана установка в контуре заказчика или Enterprise

  - name: лимит по людям или объёму
    pattern: '(до\s+\d+\s+(менеджер\w*|пользовател\w*|сотрудник\w*|оператор\w*|аккаунт\w*)|не\s+более\s+\d+\s+(менеджер\w*|пользовател\w*|сотрудник\w*|звонк\w*|минут\w*)|лимит\w*\s+(в\s+)?\d+|\d+\s+(менеджер\w*|пользовател\w*|сотрудник\w*)\s+в\s+тариф\w*)'
    pages: [home, pricing]
    when: [появилось, исчезло]
    say:
      появилось: появился лимит, которого не было
      исчезло: снят лимит, который был

  - name: новые каналы анализа
    pattern: '(видеовстреч\w*|видеозвонк\w*|видеоконференц\w*|анализ\w*\s+(чат\w*|перепис\w*|переговор\w*|встреч\w*|писем|почт\w*)|перепис\w*\s+(и|в)\s+(мессенджер\w*|чат\w*)|мессенджер\w*|\bwhatsapp\b|\bwhats\s?app\b|голосов\w*\s+ассистент\w*)'
    pages: [home, pricing]
    when: [появилось]
    say:
      появилось: заявлен новый канал анализа — игрок выходит за пределы звонков

  # Заказчик попросил отдельно: если у конкурента что-то появилось — это стоит
  # увидеть быстро, вдруг там возможность, которую мы внедрим раньше остальных.
  # Правило ловит именно новые умения продукта, а не новые статьи и кейсы.
  # Названные интеграции сюда сознательно не входят: по таблице классов они
  # обычные, и в сводке их и так видно построчно — «+ Интеграция с Битрикс24».
  - name: новая возможность продукта
    pattern: '(нов\w*\s+(возможност\w*|функци\w*|модул\w*|инструмент\w*|режим\w*)|теперь\s+(можно|умеет|доступн\w*|поддержива\w*|с\s+поддержк\w*)|добавил\w*\s+(поддержк\w*|возможност\w*|функци\w*|режим\w*)|появил\w*\s+(возможност\w*|функци\w*|поддержк\w*)|научил\w*\s+)'
    pages: [home, pricing, integrations, extra]
    when: [появилось, исчезло]
    say:
      появилось: у конкурента появилась новая возможность — смотреть сразу, пока её нет у остальных
      исчезло: возможность убрана со страницы

  - name: запуск продукта
    pattern: '(мы\s+запустил\w*|запуск\s+нов\w*|представляем\s+нов\w*|нов\w*\s+продукт\w*|нов\w*\s+модул\w*|теперь\s+доступн\w*|новинк\w*|мы\s+выпустил\w*)'
    pages: [home, pricing, extra]
    when: [появилось]
    say:
      появилось: объявлен новый продукт или модуль

  # Это правило работает везде, включая блоги и посты в соцсетях, и на живых
  # данных оказалось самым полезным: конкурент объявляет о смене тарифов в
  # новостях за несколько дней до того, как новые числа появятся на странице
  # тарифов. Именно так 19.08.2026 повёл себя Mango Office — «Актуализация
  # тарифов» в ленте новостей, а страница тарифов ещё старая.
  - name: объявление о смене тарифов
    pattern: '((актуализац\w*|измен\w*|обнов\w*|повыш\w*|снижен\w*|пересмотр\w*|нов\w*)\s+(тариф\w*|тарификац\w*|цен\w*|прайс\w*|стоимост\w*)|(тариф\w*|тарификац\w*|цен\w*|стоимост\w*)\s+(измен\w*|обнов\w*|повыс\w*|снизил\w*|вырос\w*|подорожа\w*|подешевел\w*))'
    pages: [любая]
    when: [появилось]
    say:
      появилось: объявлено об изменении тарифов или цен
